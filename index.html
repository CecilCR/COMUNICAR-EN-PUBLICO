<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentaciones Efectivas — Temores al hablar en público</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --text: #1A1814;
    --text2: #6B6860;
    --text3: #A09D97;
    --accent: #1D4E8F;
    --accent-light: #E8EFF9;
    --accent-mid: #3A72C8;
    --border: rgba(26,24,20,0.10);
    --border2: rgba(26,24,20,0.18);
    --success: #2D6A4F;
    --success-bg: #EAF5EE;
    --radius: 10px;
    --radius-lg: 16px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }
  .page { max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  .site-header {
    text-align: center;
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 0.5px solid var(--border);
  }
  .site-header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 0.5rem;
  }
  .site-header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.2;
  }
  .site-header .sub { font-size: 13px; color: var(--text2); margin-top: 0.5rem; }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  .card h2 { font-family: 'DM Serif Display', serif; font-size: 20px; font-weight: 400; margin-bottom: 0.75rem; }
  .card p { font-size: 14px; color: var(--text2); line-height: 1.7; }

  label.field-label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
  input[type="text"] {
    width: 100%; padding: 10px 14px;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: var(--accent); background: var(--surface); }

  .btn-primary {
    display: block; width: 100%;
    background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius);
    padding: 13px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    cursor: pointer; text-align: center;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }
  .btn-secondary {
    display: inline-block;
    background: transparent;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 10px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--text2);
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-secondary:hover { background: var(--surface2); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 1.25rem; }

  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-track { height: 3px; background: var(--surface2); border-radius: 2px; }
  .progress-fill { height: 3px; background: var(--accent); border-radius: 2px; transition: width 0.35s ease; }
  .progress-label { font-size: 12px; color: var(--text3); margin-bottom: 8px; }

  .q-number { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .q-text { font-size: 16px; color: var(--text); line-height: 1.55; margin-bottom: 1.5rem; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.5rem; }
  .opt {
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 12px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; color: var(--text2);
    cursor: pointer; text-align: center;
    transition: all 0.15s; line-height: 1.3;
  }
  .opt:hover { border-color: var(--accent-mid); color: var(--text); background: var(--accent-light); }
  .opt.sel { border-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 500; }

  .nav-row { display: flex; gap: 10px; }
  .nav-btn {
    flex: 1; background: transparent;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 11px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--text);
    cursor: pointer; transition: background 0.15s;
  }
  .nav-btn:hover { background: var(--surface2); }
  .nav-btn.fwd { background: var(--accent); color: #fff; border-color: var(--accent); }
  .nav-btn.fwd:hover { opacity: 0.9; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .msg-ok { font-size: 13px; color: var(--success); background: var(--success-bg); padding: 10px 12px; border-radius: var(--radius); margin-bottom: 1rem; }
  .msg-err { font-size: 13px; color: #A62C2C; background: #FDE8E8; padding: 10px 12px; border-radius: var(--radius); margin-bottom: 1rem; }
</style>
</head>
<body>

<div class="page">
  <div class="site-header">
    <div class="eyebrow">Encuesta</div>
    <h1>Presentaciones Efectivas</h1>
    <div class="sub">Temores al hablar en público</div>
  </div>

  <!-- Screen 1: Name Input -->
  <div class="screen active" id="screen1">
    <div class="card">
      <h2>¿Cuál es tu nombre?</h2>
      <label class="field-label">Nombre completo</label>
      <input type="text" id="nameInput" placeholder="Tu nombre aquí">
      <button class="btn-primary" onclick="startSurvey()" style="margin-top: 1.5rem;">Comenzar Encuesta</button>
    </div>
  </div>

  <!-- Screen 2: Survey Questions -->
  <div class="screen" id="screen2">
    <div class="progress-wrap">
      <div class="progress-label">Progreso: <span id="progressText">1/5</span></div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 20%;"></div>
      </div>
    </div>

    <div id="messageContainer"></div>

    <div class="card">
      <div class="q-number" id="qNumber">Pregunta 1 de 5</div>
      <div class="q-text" id="qText">¿Cuál es tu mayor temor al hablar en público?</div>
      <div class="opts" id="optsContainer"></div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" onclick="previousQuestion()" id="prevBtn">← Anterior</button>
      <button class="nav-btn fwd" onclick="nextQuestion()" id="nextBtn">Siguiente →</button>
    </div>
  </div>

  <!-- Screen 3: Results -->
  <div class="screen" id="screen3">
    <div class="card">
      <h2>¡Gracias, <span id="resultName"></span>!</h2>
      <p>Tu respuesta ha sido registrada exitosamente.</p>
      <div style="margin-top: 1.5rem;">
        <button class="btn-primary" onclick="resetSurvey()">Hacer otra encuesta</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
// ============================================
// FIREBASE INITIALIZATION
// ============================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCtp56Ven4Ye5EURPJk3_xTjbwt9Na_ry4",
  authDomain: "comunicar-en-publico.firebaseapp.com",
  projectId: "comunicar-en-publico",
  storageBucket: "comunicar-en-publico.firebasestorage.app",
  messagingSenderId: "200917486387",
  appId: "1:200917486387:web:83f3db599b4ef005e34c46"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

// ============================================
// SURVEY DATA
// ============================================
const questions = [
  {
    text: "¿Cuál es tu mayor temor al hablar en público?",
    options: ["Olvidar lo que iba a decir", "Ser juzgado por la audiencia", "Cometer errores", "Perder el control"]
  },
  {
    text: "¿Con qué frecuencia hablas en público?",
    options: ["Nunca", "Raramente", "A veces", "Frecuentemente"]
  },
  {
    text: "¿Has recibido capacitación en oratoria?",
    options: ["Sí", "No", "Un poco", "Actualmente estoy aprendiendo"]
  },
  {
    text: "¿Qué estrategia te ayuda más a controlar el nerviosismo?",
    options: ["Preparación y práctica", "Técnicas de respiración", "Visualización positiva", "Apoyo de otros"]
  },
  {
    text: "¿Cuál es tu nivel de confianza para hablar en público?",
    options: ["Muy bajo", "Bajo", "Medio", "Alto"]
  }
];

// ============================================
// STATE MANAGEMENT
// ============================================
let currentQuestion = 0;
let userName = "";
let answers = [];

// ============================================
// UI FUNCTIONS
// ============================================
function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(screen => {
    screen.classList.remove('active');
  });
  document.getElementById(screenId).classList.add('active');
}

function showMessage(text, type = 'ok') {
  const container = document.getElementById('messageContainer');
  container.innerHTML = `<div class="msg-${type}">${text}</div>`;
  setTimeout(() => {
    container.innerHTML = '';
  }, 3000);
}

function renderQuestion() {
  const q = questions[currentQuestion];
  document.getElementById('qNumber').textContent = `Pregunta ${currentQuestion + 1} de ${questions.length}`;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('progressText').textContent = `${currentQuestion + 1}/${questions.length}`;
  document.getElementById('progressFill').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

  const optsContainer = document.getElementById('optsContainer');
  optsContainer.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    if (answers[currentQuestion] === idx) {
      btn.classList.add('sel');
    }
    btn.textContent = opt;
    btn.onclick = () => selectOption(idx);
    optsContainer.appendChild(btn);
  });

  document.getElementById('prevBtn').disabled = currentQuestion === 0;
  document.getElementById('nextBtn').disabled = answers[currentQuestion] === undefined;
}

function selectOption(idx) {
  answers[currentQuestion] = idx;
  renderQuestion();
}

// ============================================
// SURVEY FLOW FUNCTIONS
// ============================================
function startSurvey() {
  userName = document.getElementById('nameInput').value.trim();
  if (!userName) {
    alert('Por favor ingresa tu nombre');
    return;
  }
  currentQuestion = 0;
  answers = [];
  showScreen('screen2');
  renderQuestion();
}

function nextQuestion() {
  if (answers[currentQuestion] === undefined) {
    showMessage('Por favor selecciona una opción', 'err');
    return;
  }
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    renderQuestion();
  } else {
    submitSurvey();
  }
}

function previousQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

// ============================================
// FIREBASE FUNCTIONS
// ============================================
async function submitSurvey() {
  try {
    const timestamp = new Date().toISOString();
    const responseData = {
      name: userName,
      timestamp: timestamp,
      answers: answers.map((idx, qIdx) => ({
        question: questions[qIdx].text,
        answer: questions[qIdx].options[idx],
        answerIndex: idx
      }))
    };

    // Save to Firebase Realtime Database
    const responsesRef = ref(database, 'responses');
    const newResponseRef = push(responsesRef);
    await set(newResponseRef, responseData);

    // Show success screen
    document.getElementById('resultName').textContent = userName;
    showScreen('screen3');
    showMessage('¡Encuesta guardada exitosamente!', 'ok');

  } catch (error) {
    console.error('Error al guardar la encuesta:', error);
    showMessage('Error al guardar. Intenta de nuevo.', 'err');
  }
}

function resetSurvey() {
  currentQuestion = 0;
  answers = [];
  userName = "";
  document.getElementById('nameInput').value = '';
  showScreen('screen1');
}

// ============================================
// WINDOW FUNCTIONS (for onclick handlers)
// ============================================
window.startSurvey = startSurvey;
window.nextQuestion = nextQuestion;
window.previousQuestion = previousQuestion;
window.resetSurvey = resetSurvey;

// ============================================
// INITIALIZATION
// ============================================
document.addEventListener('DOMContentLoaded', () => {
  showScreen('screen1');
});
</script>

</body>
</html>
